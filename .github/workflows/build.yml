name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ---- Linux build deps (X11 client libs for the windowing backend) ----
      # Install each package individually so a single unavailable package can't abort the job;
      # missing ones are logged and the build still runs (its log is captured below).
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq 2>&1 | tee apt.log
          for p in \
            libx11-dev libxkbcommon-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libsm-dev libice-dev \
            libxtst-dev libxi-dev libxfixes-dev libxrender-dev libxxf86vm-dev \
            libgl1-mesa-dev libegl1-dev ; do
            sudo apt-get install -y "$p" 2>&1 | tail -1 | tee -a apt.log || echo "APT_FAIL: $p" | tee -a apt.log
          done

      # bash everywhere (incl. Windows git-bash) so `pipefail` makes a real build error fatal.
      - name: Build (release)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log

      # ---- Linux packaging: portable tarball + .deb ----
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/release
          tar czf ../../mouseshare-linux.tar.gz mouseshare
          cd ../..
          cargo install cargo-deb --locked || true
          cargo deb || true
          cp target/debian/*.deb mouseshare-linux.deb 2>/dev/null || true

      # ---- Windows packaging: Inno Setup installer + zip ----
      # Inno Setup is fetched via Chocolatey (best-effort, retried up to 3x). We call ISCC via
      # its explicit install path so we don't depend on the choco PATH shim being refreshed in
      # this shell. The .zip is ALWAYS produced so a Windows artifact exists even if the
      # installer download is momentarily unreachable.
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Force -Path target/release/mouseshare.exe -DestinationPath mouseshare-windows.zip

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "::group::Attempt $i - install Inno Setup via choco"
            choco install innosetup -y --no-progress 2>&1 | Out-String | Write-Host
            Write-Host "::endgroup::"
            if (Test-Path $iscc) { $ok = $true; break }
            Start-Sleep -Seconds 15
          }

          if ($ok) {
            & $iscc installer.iss
            if (Test-Path MouseShare-Setup.exe) {
              Write-Host "Built installer: MouseShare-Setup.exe"
            } else {
              Write-Warning "iscc ran but MouseShare-Setup.exe was not produced."
            }
          } else {
            Write-Warning "Inno Setup install failed after 3 attempts; shipping .zip only."
          }

      # ---- macOS packaging: .app bundle (with icon) + drag-to-install .dmg ----
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "main" ]; then VERSION="0.0.0-dev"; fi

          rm -rf MouseShare.app && mkdir -p MouseShare.app/Contents/MacOS MouseShare.app/Contents/Resources
          cp target/release/mouseshare MouseShare.app/Contents/MacOS/
          cp resources/AppIcon.icns MouseShare.app/Contents/Resources/AppIcon.icns
          cat > MouseShare.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MouseShare</string>
            <key>CFBundleDisplayName</key><string>MouseShare</string>
            <key>CFBundleIdentifier</key><string>com.mouseshare.app</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>mouseshare</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict></plist>
          EOF
          # Ad-hoc sign so the bundle is a valid signed app (user can right-click -> Open past Gatekeeper).
          codesign --force --deep --sign - MouseShare.app 2>&1 | tail -3 || true

          # Build a "drag to Applications" DMG: app + symlink to /Applications.
          rm -rf dmgstage && mkdir -p dmgstage
          cp -R MouseShare.app dmgstage/
          ln -s /Applications dmgstage/Applications
          hdiutil create -volname MouseShare -srcfolder dmgstage -ov -format UDZO mouseshare-mac.dmg

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mouseshare-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            mouseshare-linux.tar.gz
            mouseshare-linux.deb
            mouseshare-windows.zip
            MouseShare-Setup.exe
            mouseshare-mac.dmg

      # Attaching to a GitHub Release when the trigger is a tag (e.g. v1.0.0).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # allowUpdates lets a re-pushed tag repair an existing release (e.g. fill in assets
          # that a previous run failed to build) instead of erroring with "Release already exists".
          allowUpdates: true
          files: |
            mouseshare-linux.tar.gz
            mouseshare-linux.deb
            mouseshare-windows.zip
            MouseShare-Setup.exe
            mouseshare-mac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Debug: surface the raw build log in GitHub Issue #1 (updates it if it exists, else
      # creates it) so a build error can be diagnosed without admin access to job logs.
      - name: Upload build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          os_name = os.environ.get('MATRIX_OS', '?')
          run_id = os.environ.get('GITHUB_RUN_ID', '?')
          try:
              log = open('build.log').read()[-6000:]
          except Exception as e:
              log = "(build.log missing) " + str(e)
          body = f"OS: {os_name}\nRun: {run_id}\n```\n{log}\n```"
          patch = json.dumps({"body": body}).encode()
          headers = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json",
                     "User-Agent": "curl", "Content-Type": "application/json"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/1", data=patch, method="PATCH", headers=headers)
          try:
              urllib.request.urlopen(req, timeout=30).read()
              print("updated issue #1")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  data = json.dumps({"title": "CI build log (debug)", "body": body}).encode()
                  req2 = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/issues", data=data, headers=headers)
                  print(urllib.request.urlopen(req2, timeout=30).read().decode()[:300])
              else:
                  print("patch failed", e)
          except Exception as e:
              print("issue post failed", e)
          PY
