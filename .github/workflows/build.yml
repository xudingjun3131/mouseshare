name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ---- Linux build deps (X11 client libs for the windowing backend) ----
      # Install each package individually so a single unavailable package can't abort the job;
      # missing ones are logged and the build still runs (its log is captured below).
      - name: Install Linux system libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq 2>&1 | tee /tmp/apt.log
          for p in \
            libx11-dev libxkbcommon-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libsm-dev libice-dev \
            libxtst-dev libxi-dev libxfixes-dev libxrender-dev libxxf86vm-dev \
            libgl1-mesa-dev libegl1-dev ; do
            sudo apt-get install -y "$p" 2>&1 | tail -1 | tee -a /tmp/apt.log || echo "APT_FAIL: $p" | tee -a /tmp/apt.log
          done

      - name: Build (release)
        run: cargo build --release 2>&1 | tee /tmp/build.log

      # ---- Linux packaging: portable tarball + .deb ----
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/release
          tar czf ../../mouseshare-linux.tar.gz mouseshare
          cd ../..
          cargo install cargo-deb --locked || true
          cargo deb || true
          cp target/debian/*.deb mouseshare-linux.deb 2>/dev/null || true

      # ---- Windows packaging: Inno Setup installer + zip ----
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y
          iscc installer.iss
          Compress-Archive -Path target/release/mouseshare.exe -DestinationPath mouseshare-windows.zip

      # ---- macOS packaging: .app bundle + .dmg ----
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p MouseShare.app/Contents/MacOS
          cp target/release/mouseshare MouseShare.app/Contents/MacOS/
          cat > MouseShare.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>MouseShare</string>
            <key>CFBundleDisplayName</key><string>MouseShare</string>
            <key>CFBundleIdentifier</key><string>com.mouseshare.app</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleExecutable</key><string>mouseshare</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict></plist>
          EOF
          hdiutil create -volname MouseShare -srcfolder MouseShare.app -ov -format UDZO mouseshare-mac.dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mouseshare-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            mouseshare-linux.tar.gz
            mouseshare-linux.deb
            mouseshare-windows.zip
            MouseShare-Setup.exe
            mouseshare-mac.dmg

      # Attaching to a GitHub Release when the trigger is a tag (e.g. v1.0.0).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mouseshare-linux.tar.gz
            mouseshare-linux.deb
            mouseshare-windows.zip
            MouseShare-Setup.exe
            mouseshare-mac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Debug: surface the raw build log in a GitHub Issue (readable without admin) so a
      # Linux-only link/compile error can be diagnosed. Remove once Linux is green.
      - name: Upload build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          tok = os.environ['GITHUB_TOKEN']
          try:
              log = open('/tmp/build.log').read()[-6000:]
          except Exception:
              try:
                  log = "(build.log missing) apt log:\n" + open('/tmp/apt.log').read()[-6000:]
              except Exception as e:
                  log = "(no logs) " + str(e)
          body = "```\n" + log + "\n```"
          data = json.dumps({"title": "CI Linux build log (debug)", "body": body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/xudingjun3131/mouseshare/issues",
              data=data,
              headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json",
                        "User-Agent": "curl", "Content-Type": "application/json"})
          try:
              print(urllib.request.urlopen(req, timeout=30).read().decode()[:300])
          except Exception as e:
              print("issue post failed", e)
          PY
