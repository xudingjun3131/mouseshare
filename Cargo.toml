[package]
name = "mouseshare"
version = "0.1.0"
edition = "2021"
description = "Share mouse, keyboard and clipboard across computers over LAN, with a draggable screen-layout. Cross-platform (Windows/Linux/macOS)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xudingjun3131/mouseshare"
default-run = "mouseshare"

[dependencies]
# Cross-platform global input capture + injection (listen + simulate).
# The "serialize" feature lets us forward rdev::Key/Button over the wire.
rdev = { version = "0.5", features = ["serialize"] }
# Cross-platform clipboard access.
arboard = "3"
# Immediate-mode GUI for the draggable screen layout.
# On Linux we build X11-only: rdev captures input on X11 (no Wayland support), and dropping the
# `wayland` backend avoids pulling in libEGL/libwayland-client link requirements.
eframe = { version = "0.28", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11"] }
# Serialization for the network protocol.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# App config + errors + logging.
anyhow = "1"
log = "0.4"
env_logger = "0.11"
whoami = "1"
directories = "5"
# Detect the machine's LAN IP for convenience.
local-ip-address = "0.6"
display-info = "0.5.9"

[build-dependencies]
# Embeds the Windows application icon (.ico) into the .exe at build time so the
# binary shows the MouseShare logo in Explorer instead of a generic executable icon.
# Only used on Windows (see build.rs); harmless no-op on macOS/Linux.
winresource = "0.1"

[profile.release]
opt-level = 2
lto = true

# Local copy of rdev 0.5.3 with a macOS crash fix.
#
# rdev's event-tap callback runs on a background thread but calls the Text Input Source
# APIs (TISGetInputSourceProperty) there. On macOS 13+ those APIs must run on the main
# thread for UI apps, so the call tripped `dispatch_assert_queue_fail` and killed the app
# with EXC_BREAKPOINT/SIGTRAP (rdev issue #146). MouseShare only forwards the `Key` enum
# and never uses the generated character name, so the vendored copy simply skips that
# lookup. Keep this in sync with the crates.io version if you bump `rdev` below.
[patch.crates-io]
rdev = { path = "vendor/rdev" }
